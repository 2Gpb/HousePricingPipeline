general:
  experiment_name: mean_lasso_cat_mlp
  seed: 42
  debug: False
data:
  train_path: raw_data/train.csv
  test_path: raw_data/test.csv
  submission_folder: submissions
  experiments_folder: experiments
  log_file: log.csv
  id_column: Id
  target_column: SalePrice
validation:
  n_splits: 5
  shuffle: True
model:
  name: mean
model_params:
  linear_regression: {}
  ridge:
    alpha: 1.0
  lasso:
    alpha: 0.0005
    max_iter: 10000
  elastic_net:
    alpha: 0.0005
    l1_ratio: 0.5
    max_iter: 10000
  knn:
    n_neighbors: 10
    weights: distance
  decision_tree:
    max_depth: 6
    min_samples_leaf: 5
  random_forest:
    n_estimators: 500
    max_features: 0.33
    min_samples_leaf: 2
    n_jobs: -1
  cat_boost:
    iterations: 2000
    learning_rate: 0.03
    depth: 6
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.01
    num_leaves: 15
    min_child_samples: 10
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
  xgboost:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 3
    min_child_weight: 2
    subsample: 0.8
    colsample_bytree: 0.5
  mlp:
    hidden_size: 64
    n_layers: 2
    activation: gelu
    dropout: 0.3
    loss: mse
    optimizer: adamw
    lr: 0.001
    weight_decay: 0.05
    epochs: 20
    batch_size: 64
    batch_norm: false
    device: cpu
    plot_loss: false
  mean:
    experiments:
      - lasso_full_prep
      - cat_boost_new_features
      - mlp_ohe_min_freq
  blend:
    experiments:
      - lasso_full_prep
      - cat_boost_new_features
      - mlp_ohe_min_freq
  stack:
    experiments: 
      - lasso_full_prep
      - cat_boost_new_features
      - mlp_ohe_min_freq
preprocessing:
  log_transform: False
  encoding: ohe
  scale: False
  ohe_min_frequency: null
  new_features: 
    - TotalSF
    - TotalBath
    - HouseAge
  drop_ids:
    - 524
    - 1299
  drop_columns:
    - GarageArea
    - GarageYrBlt
    - TotRmsAbvGrd
    - 1stFlrSF
    - Utilities
    - Street
    - PoolArea
    - PoolQC
  as_category:
    - MSSubClass
  log_columns:
    - LotArea
  house_parts:
    - Bsmt
    - Garage
    - Fireplace
    - Alley
    - Fence
    - MiscFeature
  ordinal_columns:
    - ExterQual
    - ExterCond
    - BsmtQual
    - BsmtCond
    - HeatingQC
    - KitchenQual
    - FireplaceQu
    - GarageQual
    - GarageCond
  mode_fill_columns:
    - BsmtFullBath
    - BsmtHalfBath
    - FullBath
    - HalfBath
    - BedroomAbvGr
    - KitchenAbvGr
    - Fireplaces
    - GarageCars
  unknown_fill_columns:
  - Exterior1st
  - Exterior2nd
  - SaleType
